name: Deploy Huffman Lab to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "Code_huffman/web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v6
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Empaquetar la web estática
        uses: actions/upload-pages-artifact@v4
        with:
          path: Code_huffman/web
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4

